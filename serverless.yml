service: serverless-reminders
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 15
  logRetentionInDays: 14
  environment:
    REMINDER_FROM: ${env:REMINDER_FROM}
    REMINDER_TO: ${env:REMINDER_TO}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource:
            - arn:aws:ses:${aws:region}:${aws:accountId}:identity/${env:SES_IDENTITY}

build:
  esbuild: false

package:
  patterns:
    - '!src/**'
    - '!test/**'
    - '!scripts/**'
    - '!docs/**'
    - '!.github/**'
    - '!tsconfig.json'
    - '!tslint.json'
    - '!README.md'
    - 'dist/**'
    - 'templates/**'

functions:
  dailyReminder:
    handler: dist/handler.sendReminderDaily
    events:
      - schedule: rate(1 day)
  weekendReminder:
    handler: dist/handler.sendReminderWeekend
    events:
      - schedule: cron(30 22 ? * SUN,SAT *)
